[package]
name = "sala"
version = "0.1.0"
description = "Chat P2P privado, sem servidor central"
authors = ["Sala"]
edition = "2024"

[lib]
# O sufixo `_lib` evita conflito de nome entre a biblioteca e o executável
# (problema conhecido no Windows: https://github.com/rust-lang/cargo/issues/8519).
# Todo o núcleo fica na biblioteca; o `main.rs` só chama `sala_lib::run()`.
name = "sala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rede P2P: conexões QUIC diretas (hole punching) com fallback por relay.
iroh = "1.5"
# Runtime assíncrono (o mesmo que o Tauri e o iroh usam por baixo).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
# Utilidades de streams usadas pelo iroh (`StreamExt::next`).
n0-future = "0.3"
# Erros com mensagem e contexto, sem precisar criar um tipo para cada caso.
anyhow = "1"
# Codifica o convite como texto copiável.
base64 = "0.23"
# Números aleatórios do sistema operacional (id da sala, senha gerada).
getrandom = "0.4"
# --- Criptografia (só bibliotecas auditadas/mantidas pelo RustCrypto) ---
# Argon2id: "estica" a senha, tornando cada tentativa cara de calcular.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# SPAKE2: troca de chaves autenticada por senha (a senha não trafega).
spake2 = "0.4"
# HMAC-SHA256: prova de que os dois lados chegaram à mesma chave.
hmac = "0.13"
sha2 = "0.11"
# Apaga senhas e chaves da memória quando deixam de ser usadas.
zeroize = "1"

# O Argon2id sem otimização (modo debug/testes) fica dezenas de vezes mais
# lento. Otimizamos só essas dependências, mesmo em debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Perfil de release otimizado para binário pequeno.
# Veja: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
