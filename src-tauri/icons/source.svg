<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do Sala: balão de conversa com um cadeado (chat privado). -->
  <!-- Fonte única: os demais tamanhos são gerados com `npx tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- balão -->
  <path d="M512 214c-188 0-340 124-340 278 0 82 43 156 112 207l-28 118c-4 17 14 30 29 21l140-82c28 6 57 9 87 9 188 0 340-124 340-278S700 214 512 214z"
        fill="url(#bubble)"/>
  <!-- cadeado -->
  <path d="M432 470v-46c0-44 36-80 80-80s80 36 80 80v46" fill="none" stroke="#022c22" stroke-width="40" stroke-linecap="round"/>
  <rect x="392" y="462" width="240" height="190" rx="36" fill="#022c22"/>
  <circle cx="512" cy="542" r="26" fill="#6ee7b7"/>
  <rect x="500" y="550" width="24" height="56" rx="12" fill="#6ee7b7"/>
</svg>
