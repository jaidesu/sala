# Gera os instaladores dos 3 sistemas e cria um rascunho de Release no GitHub.
#
# Só roda quando uma tag de versão é enviada, por exemplo:
#   git tag v0.1.0
#   git push origin v0.1.0
# (O macOS é o runner mais caro, por isso fica só aqui.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Release (${{ matrix.name }})
    permissions:
      contents: write # necessário para criar a Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Linux
            platform: ubuntu-24.04
            args: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências de sistema do Tauri (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências npm
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sala ${{ github.ref_name }}"
          releaseBody: "Instaladores gerados automaticamente. Veja o README para avisos sobre apps sem assinatura."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
