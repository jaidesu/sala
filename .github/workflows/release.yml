# Gera os instaladores dos 3 sistemas.
#
# Dois jeitos de rodar:
#
# 1. **Teste (sem publicar nada):** na aba Actions → Release → "Run workflow".
#    Os instaladores ficam só como "Artifacts" da execução (somem em 14 dias).
#
# 2. **Lançar uma versão:** enviar uma tag `v*`, por exemplo:
#      git tag v0.1.0
#      git push origin v0.1.0
#    Cria um **rascunho** de Release com os instaladores anexados. O rascunho
#    só aparece para quem administra o repositório; ele vira público quando
#    alguém clica em "Publish release" no GitHub.
#
# (No macOS os minutos contam 10×; num repositório público é tudo gratuito.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Release (${{ matrix.name }})
    permissions:
      contents: write # necessário para criar a Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: Linux
            platform: ubuntu-24.04
            args: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências de sistema do Tauri (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências npm
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Sem tag (execução manual de teste), `tagName` fica vazio e a action
          # só compila, sem criar Release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Sala ${{ github.ref_name }}"
          releaseBody: |
            Chat privado, direto entre computadores. Sem servidor, sem cadastro.

            ## Qual arquivo baixar
            - **Windows:** `Sala_x.y.z_x64-setup.exe` (recomendado) ou o `.msi`
            - **macOS com chip Apple (M1/M2/M3…):** `Sala_x.y.z_aarch64.dmg`
            - **macOS com Intel:** `Sala_x.y.z_x64.dmg`
            - **Linux:** `.AppImage` (qualquer distribuição), `.deb` (Ubuntu/Debian) ou `.rpm` (Fedora)

            ## Aviso: app sem assinatura digital
            Os instaladores ainda não são assinados (isso exige certificados pagos):
            - **Windows:** "O Windows protegeu o computador" → **Mais informações → Executar assim mesmo**.
            - **macOS:** clique com o botão direito no app → **Abrir** (ou *Ajustes → Privacidade e Segurança → Abrir mesmo assim*).
            - **Linux (AppImage):** dê permissão de execução (`chmod +x`).

            Veja o README para o modelo de segurança e as limitações conhecidas.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
